name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: manifest schema + generated package list
        run: |
          python3 scripts/gen-package-list.py --check
          python3 scripts/gen-package-list.py --out /tmp/backpack.list.chroot
          diff <(grep -v '^#' /tmp/backpack.list.chroot) <(grep -v '^#' live/config/package-lists/backpack.list.chroot)
      - name: shell + python syntax
        run: |
          for f in scripts/*.sh tools/*/*.sh live/auto/* live/config/hooks/normal/*.chroot; do [ -f "$f" ] || continue; sh -n "$f" || bash -n "$f"; done
          python3 -m py_compile touchmode/backpack_touch/*.py scripts/*.py
      - name: Stream Deck support (dummy deck, offscreen Qt)
        run: |
          sudo apt-get install -y -q libegl1 libxkbcommon0 >/dev/null
          pip install -q PySide6==6.8.2 pyyaml
          QT_QPA_PLATFORM=offscreen BACKPACK_MANIFEST=manifest/tools.yaml PYTHONPATH=touchmode \
            python3 -m unittest discover -s touchmode/tests -v
      - name: touch-mode deb builds
        run: scripts/build-touchmode-deb.sh && dpkg-deb -I live/config/packages.chroot/backpack-touch_*.deb | head -5
      - name: usb-writer deb builds
        run: SKIP_APPIMAGE=1 scripts/build-usb-writer.sh && dpkg-deb -I build/dist/backpack-usb-writer_*.deb | head -5

  usb-writer-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/usb-writer/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 1.24+: older Go links macOS binaries without LC_UUID, which current dyld refuses to load
          go-version: "1.24.7"
          cache-dependency-path: tools/usb-writer/app/go.sum
      - name: writer + persistence formatter tests (checked with e2fsck)
        run: go vet ./flash && go test -short ./flash
      - name: write a real block device (loop device, as root)
        run: |
          truncate -s 1G "$RUNNER_TEMP/disk.img"
          LOOP=$(sudo losetup -f --show "$RUNNER_TEMP/disk.img")
          go test -c -o "$RUNNER_TEMP/flash.test" ./flash
          sudo BACKPACK_TEST_LOOP="$LOOP" "$RUNNER_TEMP/flash.test" -test.run LoopDevice -test.v
          sudo losetup -d "$LOOP"
      - name: cross-compile checks
        run: GOOS=windows go vet ./flash && GOOS=darwin go vet ./flash

  usb-writer-app-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tools/usb-writer/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: tools/usb-writer/app/go.sum
      - name: writer tests on macOS
        run: go test -short ./flash ./update
      - name: authopen descriptor passing (as root)
        run: go test -c -o "$RUNNER_TEMP/flash.test" ./flash && sudo "$RUNNER_TEMP/flash.test" -test.run AuthOpen -test.v
      - name: build the app as release.yml does
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -platform darwin/universal -skipbindings -trimpath
      - name: worker smoke test as root against a disk image (this build)
        run: test/mac-smoke.sh "$(ls -d "$PWD"/build/bin/*.app)/Contents/MacOS/"* "this build"
      - name: worker smoke test through osascript, as the window runs it
        run: VIA=osascript test/mac-smoke.sh "$(ls -d "$PWD"/build/bin/*.app)/Contents/MacOS/"* "osascript"
