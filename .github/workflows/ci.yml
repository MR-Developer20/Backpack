name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: manifest schema + generated package list
        run: |
          python3 scripts/gen-package-list.py --check
          python3 scripts/gen-package-list.py --out /tmp/backpack.list.chroot
          diff <(grep -v '^#' /tmp/backpack.list.chroot) <(grep -v '^#' live/config/package-lists/backpack.list.chroot)
      - name: shell + python syntax
        run: |
          for f in scripts/*.sh tools/*/*.sh live/auto/* live/config/hooks/normal/*.chroot; do [ -f "$f" ] || continue; sh -n "$f" || bash -n "$f"; done
          python3 -m py_compile touchmode/backpack_touch/*.py scripts/*.py
      - name: touch-mode deb builds
        run: scripts/build-touchmode-deb.sh && dpkg-deb -I live/config/packages.chroot/backpack-touch_*.deb | head -5
      - name: mkusb deb builds (USB writer CLI + GUI)
        run: |
          sudo apt-get install -y -qq --no-install-recommends desktop-file-utils
          scripts/build-mkusb-deb.sh /tmp/mkusb && dpkg-deb -I /tmp/mkusb/backpack-mkusb_*.deb | head -5
          desktop-file-validate mkusb/backpack-mkusb.desktop
          python3 -c 'import xml.dom.minidom; xml.dom.minidom.parse("mkusb/live.backpack.mkusb.policy")'
