name: release
# Pushing a tag like v1.2.0 builds the ISO, the GTK USB writer (.deb + AppImage) and the
# standalone USB writer for Linux, Windows and macOS (tools/usb-writer/app), and publishes them
# as a GitHub release. A manual run (Actions -> release -> Run workflow) builds the same files as
# workflow artifacts only, without creating a release; so does a pull request that changes this
# workflow or the packaging scripts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-usb-writer.sh
      - scripts/release.sh
      - tools/usb-writer/**

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: free disk space for live-build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: host dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: build ISO (live-build in a privileged debian:trixie container)
        run: make build
      - name: build log
        if: failure()
        run: tail -n 200 build/logs/build.log || true
      - name: stage release ISO
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: build/release/*.iso
          compression-level: 0
          retention-days: 7

  usb-writer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: package .deb + AppImage
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/build-usb-writer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: usb-writer
          path: build/dist/*
          retention-days: 7

  # Standalone writer (Go + Wails): one program per OS, built natively on each runner.
  usb-writer-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux/amd64, out: linux-x86_64 }
          - { os: windows-latest, platform: windows/amd64, out: windows-x86_64.exe }
          - { os: macos-latest, platform: darwin/universal, out: macos-universal.zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: tools/usb-writer/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/usb-writer/app/go.mod
          cache-dependency-path: tools/usb-writer/app/go.sum
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: tests (writer + persistence formatter, checked with e2fsck)
        if: runner.os == 'Linux'
        run: go test ./...
      - name: build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          V="${VERSION:-0.0.0-${GITHUB_SHA::7}}"; echo "V=$V" >> "$GITHUB_ENV"
          TAGS=""; [ "$RUNNER_OS" = Linux ] && TAGS="-tags webkit2_41"
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -platform ${{ matrix.platform }} -skipbindings -trimpath $TAGS \
            -ldflags "-X main.version=$V"
          ls -la build/bin
      - name: stage
        run: |
          mkdir -p dist; OUT="dist/Backpack_USB_Writer-$V-${{ matrix.out }}"
          case "$RUNNER_OS" in
            Linux)   cp build/bin/backpack-usb-writer "$OUT"; chmod +x "$OUT"; "$OUT" --version ;;
            Windows) cp build/bin/backpack-usb-writer.exe "$OUT" ;;
            macOS)   APP="$(ls -d build/bin/*.app | head -n1)"; ditto -c -k --keepParent "$APP" "$OUT" ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: usb-writer-app-${{ runner.os }}
          path: tools/usb-writer/app/dist/*
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: [iso, usb-writer, usb-writer-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Backpack Live $TAG" -R "$GITHUB_REPOSITORY"
          fi
