name: release
# Pushing a tag like v1.2.0 builds both ISO editions (normal, and + extras with the Extra tab's apps), the GTK USB writer (.deb + AppImage) and the
# standalone USB writer for Linux, Windows and macOS (tools/usb-writer/app), and publishes them
# as a GitHub release. A manual run (Actions -> release -> Run workflow) builds the same files as
# workflow artifacts only, without creating a release; so does a pull request that changes this
# workflow or the packaging scripts (the ISO only when this workflow or scripts/release.sh changed).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-usb-writer.sh
      - scripts/release.sh
      - tools/usb-writer/**

permissions:
  contents: read

jobs:
  # On pull requests, the ISO is only rebuilt when the release packaging itself changed;
  # a PR that only touches the USB writer skips the ~10 minute ISO build.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      iso: ${{ steps.diff.outputs.iso }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"; echo "$changed"
          if echo "$changed" | grep -qE '^(\.github/workflows/release\.yml|scripts/release\.sh)$'
          then echo iso=true; else echo iso=false; fi | tee -a "$GITHUB_OUTPUT"

  iso:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.iso == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        edition: [normal, extras]   # Makefile EDITION
    runs-on: ubuntu-24.04
    # A normal build takes ~5-10 minutes; fail fast instead of sitting on a stuck mirror for hours.
    timeout-minutes: 60   # eDEX-UI (npm + electron-builder) is built inside make build
    steps:
      - uses: actions/checkout@v4
      - name: disk space
        run: df -h /
      - name: host dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      # live-build keeps every downloaded .deb in live/cache/packages.*; reusing them skips most of
      # the downloads from deb.debian.org. Tag runs can read the cache saved by a run on main.
      # The month in the key starts a fresh cache now and then so old package versions don't pile up.
      - name: month (cache key)
        run: echo "MONTH=$(date -u +%Y-%m)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            live/cache/packages.bootstrap
            live/cache/packages.chroot
          key: lb-packages-${{ matrix.edition }}-${{ env.MONTH }}-${{ github.run_id }}
          restore-keys: lb-packages-${{ matrix.edition }}-${{ env.MONTH }}-
      - name: build ${{ matrix.edition }} ISO (live-build in a privileged debian:trixie container)
        # make build writes live-build's output to build/logs/build.log; follow it so progress
        # shows up live in the Actions log.
        run: |
          mkdir -p build/logs && : > build/logs/build.log
          make build EDITION=${{ matrix.edition }} & pid=$!
          tail -n +1 -F build/logs/build.log --pid=$pid 2>/dev/null &
          wait $pid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.edition }}
          path: build/logs/build.log
          retention-days: 7
      - name: stage release ISO
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          EDITION: ${{ matrix.edition }}
        run: scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.edition }}
          path: build/release/*.iso
          compression-level: 0
          retention-days: 7

  usb-writer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: package .deb + AppImage
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/build-usb-writer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: usb-writer
          path: build/dist/*
          retention-days: 7

  # Standalone writer (Go + Wails): one program per OS, built natively on each runner.
  usb-writer-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux/amd64, out: linux-x86_64 }
          - { os: windows-latest, platform: windows/amd64, out: windows-x86_64.exe }
          - { os: macos-latest, platform: darwin/universal, out: macos-universal.zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: tools/usb-writer/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 1.24+: older Go links macOS binaries without LC_UUID, which current dyld refuses to load
          go-version: "1.24.7"
          cache-dependency-path: tools/usb-writer/app/go.sum
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: tests (writer + persistence formatter, checked with e2fsck)
        if: runner.os == 'Linux'
        run: go test ./...
      - name: build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          V="${VERSION:-0.0.0-${GITHUB_SHA::7}}"; echo "V=$V" >> "$GITHUB_ENV"
          TAGS=""; [ "$RUNNER_OS" = Linux ] && TAGS="-tags webkit2_41"
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -platform ${{ matrix.platform }} -skipbindings -trimpath $TAGS \
            -ldflags "-X main.version=$V"
          ls -la build/bin
      - name: stage
        run: |
          mkdir -p dist; OUT="dist/Backpack_USB_Writer-$V-${{ matrix.out }}"
          case "$RUNNER_OS" in
            Linux)   cp build/bin/backpack-usb-writer "$OUT"; chmod +x "$OUT"; "$OUT" --version ;;
            Windows) cp build/bin/backpack-usb-writer.exe "$OUT" ;;
            macOS)   APP="$(ls -d build/bin/*.app | head -n1)"; ditto -c -k --keepParent "$APP" "$OUT" ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: usb-writer-app-${{ runner.os }}
          path: tools/usb-writer/app/dist/*
          retention-days: 7

  publish:
    if: ${{ !cancelled() && !failure() && github.ref_type == 'tag' }}
    needs: [iso, usb-writer, usb-writer-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # the release files only: the build-log-* artifacts stay on the run
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: iso-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: usb-writer*
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Backpack Live $TAG" -R "$GITHUB_REPOSITORY"
          fi
