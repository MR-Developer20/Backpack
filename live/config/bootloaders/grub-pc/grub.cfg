source /boot/grub/config.cfg

# Re-anchor $root to the Backpack ISO by a unique marker file. This makes the kernel/initrd
# paths below resolve on the real ISO under Ventoy and other loopback/chainload bootloaders,
# where the inherited $root may point elsewhere (symptom: "error: invalid magic number").
if search --no-floppy --set=root --file /.backpack-live ; then true ; fi

# Backpack Field Terminal theme (art: tools/assets/gen-bootmenu.sh). Falls back to the plain splash.
insmod png
# (GRUB script has no &&: loadfont takes the three files at once)
if loadfont /boot/grub/backpack/text-16.pf2 /boot/grub/backpack/text-22.pf2 /boot/grub/backpack/text-bold-22.pf2 ; then
  # The theme is a fixed 1024x768 block centred on the screen. Portrait panels whose firmware has no
  # 1024x768 mode (GPD Pocket 3: 1200x1920) get their native mode, never a smaller one that clips it.
  set gfxmode=1024x768,1200x1920,1920x1200,1920x1080,auto
  terminal_output console
  terminal_output gfxterm
  set theme=/boot/grub/backpack/theme.txt
  export theme
elif background_image /boot/grub/splash.png ; then
  set color_normal=light-gray/black
  set color_highlight=black/light-green
fi

set timeout=10

menuentry "GUI Mode" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ backpack.ui=touch
	initrd	@INITRD_LIVE@
}
menuentry "CLI Mode" --hotkey=c {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ systemd.unit=multi-user.target
	initrd	@INITRD_LIVE@
}
menuentry "GUI Mode - copy to RAM" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ backpack.ui=touch toram
	initrd	@INITRD_LIVE@
}
menuentry "CLI Mode - copy to RAM" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ systemd.unit=multi-user.target toram
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {
	source /boot/grub/theme.cfg
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi
}
