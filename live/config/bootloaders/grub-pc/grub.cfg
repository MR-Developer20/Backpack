source /boot/grub/config.cfg

set timeout=10

menuentry "Desktop (LXQt)" --hotkey=d {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "Terminal" --hotkey=t {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ systemd.unit=multi-user.target
	initrd	@INITRD_LIVE@
}
menuentry "Touch Mode" --hotkey=m {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nettoolkit.ui=touch
	initrd	@INITRD_LIVE@
}
menuentry "Desktop (LXQt) - copy to RAM" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}
menuentry "Terminal - copy to RAM" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ systemd.unit=multi-user.target toram
	initrd	@INITRD_LIVE@
}
menuentry "Touch Mode - copy to RAM" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nettoolkit.ui=touch toram
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {
	source /boot/grub/theme.cfg
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi
}
