# NetToolkit Live tool manifest.
# Drives: apt package list (scripts/gen-package-list.py), Touch Mode tiles, docs.
#
# Schema (version 1):
#   id          [a-z0-9-], unique
#   name        display name
#   description one plain-English sentence
#   category    discovery | connectivity | capture | wireless | throughput | dns-http
#   packages    Debian package names (required; for upstream sources = extra deps)
#   source      optional: {type: upstream, url, sha256, apt_repo, apt_key_url, apt_key_sha256}
#   gui         optional bool; Touch Mode launches GUI tools detached instead of streaming output
#   commands[]  {label, cmd, args[], needs_root}
#   args[]      {name, type: string|int|flag|choice, default, required, flag, options}
#               flag type emits `flag` when true; other types emit `flag value` if flag set,
#               else the bare value; args are emitted in declared order.
version: 1
tools:
  # ---------------------------------------------------------------- discovery
  - id: nmap
    name: Nmap
    description: Scans hosts and ports to discover what is running on a network.
    category: discovery
    packages: [nmap]
    commands:
      - label: Ping sweep
        cmd: nmap
        args:
          - {name: sn, type: flag, default: true, flag: "-sn"}
          - {name: target, type: string, default: "192.168.1.0/24", required: true}
        needs_root: false
      - label: Fast port scan
        cmd: nmap
        args:
          - {name: fast, type: flag, default: true, flag: "-F"}
          - {name: target, type: string, default: "192.168.1.1", required: true}
        needs_root: false
      - label: Service + OS detection
        cmd: nmap
        args:
          - {name: aggressive, type: flag, default: true, flag: "-A"}
          - {name: target, type: string, default: "192.168.1.1", required: true}
        needs_root: true
  - id: zenmap
    name: Zenmap
    description: Graphical front-end for Nmap with saved profiles and a topology view.
    category: discovery
    packages: [zenmap]
    gui: true
    commands:
      - label: Open Zenmap
        cmd: zenmap
        args: []
        needs_root: true
  - id: arp-scan
    name: ARP scan
    description: Finds every live host on the local Ethernet segment using ARP requests.
    category: discovery
    packages: [arp-scan]
    commands:
      - label: Scan local network
        cmd: arp-scan
        args:
          - {name: interface, type: string, default: "", required: false, flag: "-I"}
          - {name: localnet, type: flag, default: true, flag: "--localnet"}
        needs_root: true
  - id: netdiscover
    name: Netdiscover
    description: Passively or actively discovers hosts on a LAN via ARP.
    category: discovery
    packages: [netdiscover]
    commands:
      - label: Active scan
        cmd: netdiscover
        args:
          - {name: interface, type: string, default: "", required: false, flag: "-i"}
          - {name: range, type: string, default: "192.168.1.0/24", required: true, flag: "-r"}
          - {name: print_only, type: flag, default: true, flag: "-P"}
        needs_root: true
  - id: lldpd
    name: LLDP neighbours
    description: Shows which switch and port this machine is plugged into via LLDP and CDP.
    category: discovery
    packages: [lldpd]
    commands:
      - label: Show neighbours
        cmd: lldpcli
        args:
          - {name: show, type: choice, default: "neighbors", options: ["neighbors", "interfaces", "chassis"], required: true}
        needs_root: true
  - id: ipscan
    name: Angry IP Scanner
    description: Fast cross-platform GUI IP and port scanner.
    category: discovery
    source:
      type: upstream
      url: https://github.com/angryip/ipscan/releases/download/3.10.0/ipscan_3.10.0_amd64.deb
      sha256: 8c7286941d4bbbb1c804e9b7e3cb9dd6bc3974cfcee7ec89c3f24ffeb52a8217
    packages: [openjdk-21-jre]
    gui: true
    commands:
      - label: Open Angry IP Scanner
        cmd: ipscan
        args: []
        needs_root: false
  # ------------------------------------------------------------- connectivity
  - id: mtr
    name: MTR
    description: Combines ping and traceroute to show loss and latency per hop.
    category: connectivity
    packages: [mtr-tiny]
    commands:
      - label: Trace (report mode)
        cmd: mtr
        args:
          - {name: report, type: flag, default: true, flag: "--report"}
          - {name: count, type: int, default: 10, flag: "-c"}
          - {name: host, type: string, default: "1.1.1.1", required: true}
        needs_root: false
  - id: fping
    name: fping
    description: Pings many hosts or a whole subnet in parallel and lists who answers.
    category: connectivity
    packages: [fping]
    commands:
      - label: Sweep subnet
        cmd: fping
        args:
          - {name: alive, type: flag, default: true, flag: "-a"}
          - {name: quiet, type: flag, default: true, flag: "-q"}
          - {name: generate, type: string, default: "192.168.1.0/24", required: true, flag: "-g"}
        needs_root: false
  - id: ethtool
    name: ethtool
    description: Shows link speed, duplex and NIC driver details for an interface.
    category: connectivity
    packages: [ethtool]
    commands:
      - label: Link status
        cmd: ethtool
        args:
          - {name: interface, type: string, default: "eth0", required: true}
        needs_root: true
  - id: socat
    name: socat
    description: Opens a raw TCP or UDP connection to test whether a port answers.
    category: connectivity
    packages: [socat]
    commands:
      - label: TCP connect test
        cmd: socat
        args:
          - {name: timeout, type: int, default: 5, flag: "-T"}
          - {name: stdio, type: string, default: "-", required: true}
          - {name: target, type: string, default: "TCP:192.168.1.1:80", required: true}
        needs_root: false
  - id: netcat
    name: Netcat
    description: Checks whether TCP or UDP ports are open and talks to them by hand.
    category: connectivity
    packages: [netcat-openbsd]
    commands:
      - label: Port check
        cmd: nc
        args:
          - {name: zero_io, type: flag, default: true, flag: "-z"}
          - {name: verbose, type: flag, default: true, flag: "-v"}
          - {name: host, type: string, default: "192.168.1.1", required: true}
          - {name: ports, type: string, default: "22-443", required: true}
        needs_root: false
  - id: hping3
    name: hping3
    description: Crafts custom TCP, UDP and ICMP packets to probe hosts and firewalls.
    category: connectivity
    packages: [hping3]
    commands:
      - label: TCP SYN probe
        cmd: hping3
        args:
          - {name: syn, type: flag, default: true, flag: "-S"}
          - {name: port, type: int, default: 80, flag: "-p"}
          - {name: count, type: int, default: 5, flag: "-c"}
          - {name: host, type: string, default: "192.168.1.1", required: true}
        needs_root: true
  - id: wpasupplicant
    name: wpa_supplicant
    description: Connects to WPA and 802.1X protected networks from the command line.
    category: connectivity
    packages: [wpasupplicant]
    commands:
      - label: Show Wi-Fi status
        cmd: wpa_cli
        args:
          - {name: interface, type: string, default: "wlan0", required: true, flag: "-i"}
          - {name: command, type: choice, default: "status", options: ["status", "scan_results", "list_networks"], required: true}
        needs_root: true
  # ------------------------------------------------------------------ capture
  - id: tcpdump
    name: tcpdump
    description: Captures packets on an interface and prints them as text.
    category: capture
    packages: [tcpdump]
    commands:
      - label: Capture (count-limited)
        cmd: tcpdump
        args:
          - {name: interface, type: string, default: "any", required: true, flag: "-i"}
          - {name: count, type: int, default: 50, flag: "-c"}
          - {name: no_resolve, type: flag, default: true, flag: "-n"}
          - {name: filter, type: string, default: "", required: false}
        needs_root: true
  - id: tshark
    name: TShark
    description: Terminal version of Wireshark with full protocol decoding.
    category: capture
    packages: [tshark]
    commands:
      - label: Capture (count-limited)
        cmd: tshark
        args:
          - {name: interface, type: string, default: "any", required: true, flag: "-i"}
          - {name: count, type: int, default: 50, flag: "-c"}
          - {name: filter, type: string, default: "", required: false, flag: "-f"}
        needs_root: true
  - id: wireshark
    name: Wireshark
    description: Graphical packet analyser.
    category: capture
    packages: [wireshark]
    gui: true
    commands:
      - label: Open Wireshark
        cmd: wireshark
        args: []
        needs_root: false
  - id: ngrep
    name: ngrep
    description: Greps packet payloads on the wire for a text pattern.
    category: capture
    packages: [ngrep]
    commands:
      - label: Match pattern
        cmd: ngrep
        args:
          - {name: interface, type: string, default: "any", required: true, flag: "-d"}
          - {name: quiet, type: flag, default: true, flag: "-q"}
          - {name: pattern, type: string, default: "GET", required: true}
          - {name: filter, type: string, default: "tcp port 80", required: false}
        needs_root: true
  # ----------------------------------------------------------------- wireless
  - id: aircrack-ng
    name: Aircrack-ng
    description: Wi-Fi monitoring suite that lists nearby networks and clients.
    category: wireless
    packages: [aircrack-ng]
    commands:
      - label: Enable monitor mode
        cmd: airmon-ng
        args:
          - {name: action, type: choice, default: "start", options: ["start", "stop", "check"], required: true}
          - {name: interface, type: string, default: "wlan0", required: true}
        needs_root: true
      - label: Scan networks (airodump)
        cmd: airodump-ng
        args:
          - {name: interface, type: string, default: "wlan0mon", required: true}
        needs_root: true
  - id: kismet
    name: Kismet
    description: Wireless network and device detector, sniffer and IDS with a web UI.
    category: wireless
    source:
      type: upstream
      apt_repo: "deb https://www.kismetwireless.net/repos/apt/release/trixie trixie main"
      apt_key_url: https://www.kismetwireless.net/repos/kismet-release.gpg.key
      apt_key_sha256: 3496a7b046c133a8be8682f851aacb3e68dace45fd6324f3506e2591c79c2568
    packages: [kismet]
    commands:
      - label: Start Kismet (web UI on :2501)
        cmd: kismet
        args:
          - {name: interface, type: string, default: "wlan0", required: true, flag: "-c"}
        needs_root: true
  # --------------------------------------------------------------- throughput
  - id: iperf3
    name: iperf3
    description: Measures TCP and UDP throughput between two hosts.
    category: throughput
    packages: [iperf3]
    commands:
      - label: Run server
        cmd: iperf3
        args:
          - {name: server, type: flag, default: true, flag: "-s"}
        needs_root: false
      - label: Run client
        cmd: iperf3
        args:
          - {name: client, type: string, default: "192.168.1.1", required: true, flag: "-c"}
          - {name: time, type: int, default: 10, flag: "-t"}
          - {name: reverse, type: flag, default: false, flag: "-R"}
        needs_root: false
  - id: iftop
    name: iftop
    description: Shows live bandwidth usage per connection on an interface.
    category: throughput
    packages: [iftop]
    commands:
      - label: Monitor interface
        cmd: iftop
        args:
          - {name: interface, type: string, default: "eth0", required: true, flag: "-i"}
          - {name: no_resolve, type: flag, default: true, flag: "-n"}
        needs_root: true
  - id: nload
    name: nload
    description: Live graph of incoming and outgoing traffic per interface.
    category: throughput
    packages: [nload]
    commands:
      - label: Monitor interface
        cmd: nload
        args:
          - {name: interface, type: string, default: "eth0", required: true}
        needs_root: false
  - id: bmon
    name: bmon
    description: Bandwidth monitor with per-interface rate graphs.
    category: throughput
    packages: [bmon]
    commands:
      - label: Monitor
        cmd: bmon
        args:
          - {name: policy, type: string, default: "", required: false, flag: "-p"}
        needs_root: false
  - id: speedtest
    name: Speedtest
    description: Measures internet download and upload speed against speedtest.net.
    category: throughput
    packages: [speedtest-cli]
    commands:
      - label: Run speed test
        cmd: speedtest-cli
        args:
          - {name: simple, type: flag, default: true, flag: "--simple"}
        needs_root: false
  # ----------------------------------------------------------------- dns-http
  - id: dnsutils
    name: dig / nslookup
    description: Queries DNS servers for any record type.
    category: dns-http
    packages: [bind9-dnsutils]
    commands:
      - label: dig
        cmd: dig
        args:
          - {name: server, type: string, default: "", required: false, flag: "@"}
          - {name: name, type: string, default: "example.com", required: true}
          - {name: type, type: choice, default: "A", options: ["A", "AAAA", "MX", "NS", "TXT", "CNAME", "SOA", "PTR", "ANY"], required: true}
        needs_root: false
      - label: nslookup
        cmd: nslookup
        args:
          - {name: name, type: string, default: "example.com", required: true}
          - {name: server, type: string, default: "", required: false}
        needs_root: false
  - id: curl
    name: curl
    description: Fetches a URL and shows HTTP headers and timing.
    category: dns-http
    packages: [curl]
    commands:
      - label: HEAD request
        cmd: curl
        args:
          - {name: head, type: flag, default: true, flag: "-I"}
          - {name: follow, type: flag, default: true, flag: "-L"}
          - {name: url, type: string, default: "https://example.com", required: true}
        needs_root: false
      - label: Timing breakdown
        cmd: curl
        args:
          - {name: silent, type: flag, default: true, flag: "-s"}
          - {name: output, type: string, default: "/dev/null", required: true, flag: "-o"}
          - {name: format, type: string, default: "dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s http=%{http_code}\n", required: true, flag: "-w"}
          - {name: url, type: string, default: "https://example.com", required: true}
        needs_root: false
