# Backpack Live tool manifest.
# Drives: apt package list (scripts/gen-package-list.py), GUI Mode tiles, docs.
#
# Schema (version 1):
#   id          [a-z0-9-], unique
#   name        display name
#   description one plain-English sentence
#   category    Network tab: discovery | connectivity | capture | wireless | throughput | dns-http
#               Data tab:    disks | recovery | files | transfer
#               Extra tab:   extra (other software; only in the `extras` ISO edition, see Makefile EDITION)
#   packages    Debian package names (required; for upstream sources = extra deps)
#   source      optional: {type: upstream, url, sha256, apt_repo, apt_key_url, apt_key_sha256}
#   gui         optional bool; GUI Mode launches GUI tools detached instead of streaming output
#   optional    optional bool; the program is installed separately (not from `packages`), so GUI Mode
#               hides the tile when its command is missing and check-tools.sh does not require it
#   commands[]  {label, cmd, args[], needs_root, tty?}  tty: true = run inside foot (curses UIs)
#   args[]      {name, type: string|int|flag|choice|interface, default, required, flag, options, sep?, label?, kind?}
#               label: what the GUI form calls the field (a thing a person recognises, e.g.
#               "Ping only" for -sn); defaults to the name with underscores as spaces
#               sep: "" joins flag and value with no space (e.g. dig @server)
#               flag type emits `flag` when true; other types emit `flag value` if flag set,
#               else the bare value; args are emitted in declared order.
version: 1
tools:
  # ---------------------------------------------------------------- discovery
  - id: nmap
    name: Nmap
    description: Scans hosts and ports to discover what is running on a network.
    category: discovery
    packages: [nmap]
    commands:
      - label: Ping sweep
        cmd: nmap
        args:
          - {name: sn, type: flag, default: true, flag: "-sn", label: "Ping only"}
          - {name: target, type: string, default: "192.168.1.0/24", required: true}
        needs_root: false
      - label: Fast port scan
        cmd: nmap
        args:
          - {name: fast, type: flag, default: true, flag: "-F", label: "Fast (top 100 ports)"}
          - {name: target, type: string, default: "192.168.1.1", required: true}
        needs_root: false
      - label: Service + OS detection
        cmd: nmap
        args:
          - {name: aggressive, type: flag, default: true, flag: "-A", label: "Aggressive (-A)"}
          - {name: target, type: string, default: "192.168.1.1", required: true}
        needs_root: true
  - id: zenmap
    name: Zenmap
    description: Graphical front-end for Nmap with saved profiles and a topology view.
    category: discovery
    packages: [zenmap]
    gui: true
    commands:
      - label: Open Zenmap
        cmd: zenmap
        args: []
        needs_root: false
  - id: arp-scan
    name: ARP scan
    description: Finds every live host on the local Ethernet segment using ARP requests.
    category: discovery
    packages: [arp-scan]
    commands:
      - label: Scan local network
        cmd: arp-scan
        args:
          - {name: interface, type: interface, label: "Interface", default: "", required: false, flag: "-I"}
          - {name: localnet, type: flag, default: true, flag: "--localnet", label: "Local network"}
        needs_root: true
  - id: netdiscover
    name: Netdiscover
    description: Passively or actively discovers hosts on a LAN via ARP.
    category: discovery
    packages: [netdiscover]
    commands:
      - label: Active scan
        cmd: netdiscover
        args:
          - {name: interface, type: interface, label: "Interface", default: "", required: false, flag: "-i"}
          - {name: range, type: string, default: "192.168.1.0/24", required: true, flag: "-r", label: "Range"}
          - {name: print_only, type: flag, default: true, flag: "-P", label: "Print only"}
        needs_root: true
  - id: lldpd
    name: LLDP neighbours
    description: Shows which switch and port this machine is plugged into via LLDP and CDP.
    category: discovery
    packages: [lldpd]
    commands:
      - label: Show neighbours
        cmd: lldpcli
        args:
          - {name: show, type: choice, default: "neighbors", options: ["neighbors", "interfaces", "chassis"], required: true, label: "Show"}
        needs_root: true
  - id: ipscan
    name: Angry IP Scanner
    description: Fast cross-platform GUI IP and port scanner.
    category: discovery
    source:
      type: upstream
      url: https://github.com/angryip/ipscan/releases/download/3.10.0/ipscan_3.10.0_amd64.deb
      sha256: 8c7286941d4bbbb1c804e9b7e3cb9dd6bc3974cfcee7ec89c3f24ffeb52a8217
    packages: [openjdk-21-jre]
    gui: true
    commands:
      - label: Open Angry IP Scanner
        cmd: ipscan
        args: []
        needs_root: false
  # ------------------------------------------------------------- connectivity
  - id: mtr
    name: MTR
    description: Combines ping and traceroute to show loss and latency per hop.
    category: connectivity
    packages: [mtr-tiny]
    commands:
      - label: Trace (report mode)
        cmd: mtr
        args:
          - {name: report, type: flag, default: true, flag: "--report", label: "Report mode"}
          - {name: count, type: int, default: 10, flag: "-c", label: "Cycles"}
          - {name: host, type: string, default: "1.1.1.1", required: true}
        needs_root: false
  - id: fping
    name: fping
    description: Pings many hosts or a whole subnet in parallel and lists who answers.
    category: connectivity
    packages: [fping]
    commands:
      - label: Sweep subnet
        cmd: fping
        args:
          - {name: alive, type: flag, default: true, flag: "-a", label: "Alive only"}
          - {name: quiet, type: flag, default: true, flag: "-q", label: "Quiet"}
          - {name: generate, type: string, default: "192.168.1.0/24", required: true, flag: "-g", label: "Subnet"}
        needs_root: false
  - id: ethtool
    name: ethtool
    description: Shows link speed, duplex and NIC driver details for an interface.
    category: connectivity
    packages: [ethtool]
    commands:
      - label: Link status
        cmd: ethtool
        args:
          - {name: interface, type: interface, label: "Interface", kind: wired, default: "", required: true}
        needs_root: true
  - id: socat
    name: socat
    description: Opens a raw TCP or UDP connection to test whether a port answers.
    category: connectivity
    packages: [socat]
    commands:
      - label: TCP connect test
        cmd: socat
        args:
          - {name: timeout, type: int, default: 5, flag: "-T", label: "Timeout (s)"}
          - {name: stdio, type: string, default: "-", required: true, label: "Local end"}
          - {name: target, type: string, default: "TCP:192.168.1.1:80", required: true, label: "Remote end"}
        needs_root: false
  - id: netcat
    name: Netcat
    description: Checks whether TCP or UDP ports are open and talks to them by hand.
    category: connectivity
    packages: [netcat-openbsd]
    commands:
      - label: Port check
        cmd: nc
        args:
          - {name: zero_io, type: flag, default: true, flag: "-z", label: "Scan only (-z)"}
          - {name: verbose, type: flag, default: true, flag: "-v", label: "Verbose"}
          - {name: host, type: string, default: "192.168.1.1", required: true}
          - {name: ports, type: string, default: "22-443", required: true, label: "Ports"}
        needs_root: false
  - id: hping3
    name: hping3
    description: Crafts custom TCP, UDP and ICMP packets to probe hosts and firewalls.
    category: connectivity
    packages: [hping3]
    commands:
      - label: TCP SYN probe
        cmd: hping3
        args:
          - {name: syn, type: flag, default: true, flag: "-S", label: "SYN flag"}
          - {name: port, type: int, default: 80, flag: "-p"}
          - {name: count, type: int, default: 5, flag: "-c", label: "Packets"}
          - {name: host, type: string, default: "192.168.1.1", required: true}
        needs_root: true
  - id: wpasupplicant
    name: wpa_supplicant
    description: Connects to WPA and 802.1X protected networks from the command line.
    category: connectivity
    packages: [wpasupplicant]
    commands:
      - label: Show Wi-Fi status
        cmd: wpa_cli
        args:
          - {name: interface, type: interface, label: "Interface", kind: wifi, default: "", required: true, flag: "-i"}
          - {name: command, type: choice, default: "status", options: ["status", "scan_results", "list_networks"], required: true, label: "Query"}
        needs_root: true
  # ------------------------------------------------------------------ capture
  - id: tcpdump
    name: tcpdump
    description: Captures packets on an interface and prints them as text.
    category: capture
    packages: [tcpdump]
    commands:
      - label: Capture (count-limited)
        cmd: tcpdump
        args:
          - {name: interface, type: interface, label: "Interface", options: ["any"], default: "any", required: true, flag: "-i"}
          - {name: count, type: int, default: 50, flag: "-c", label: "Packets"}
          - {name: no_resolve, type: flag, default: true, flag: "-n", label: "No DNS lookups"}
          - {name: filter, type: string, default: "", required: false, label: "Filter"}
        needs_root: true
  - id: tshark
    name: TShark
    description: Terminal version of Wireshark with full protocol decoding.
    category: capture
    packages: [tshark]
    commands:
      - label: Capture (count-limited)
        cmd: tshark
        args:
          - {name: interface, type: interface, label: "Interface", options: ["any"], default: "any", required: true, flag: "-i"}
          - {name: count, type: int, default: 50, flag: "-c", label: "Packets"}
          - {name: filter, type: string, default: "", required: false, flag: "-f", label: "Capture filter"}
        needs_root: true
  - id: wireshark
    name: Wireshark
    description: Graphical packet analyser.
    category: capture
    packages: [wireshark]
    gui: true
    commands:
      - label: Open Wireshark
        cmd: wireshark
        args: []
        needs_root: false
  - id: ngrep
    name: ngrep
    description: Greps packet payloads on the wire for a text pattern.
    category: capture
    packages: [ngrep]
    commands:
      - label: Match pattern
        cmd: ngrep
        args:
          - {name: interface, type: interface, label: "Interface", options: ["any"], default: "any", required: true, flag: "-d"}
          - {name: quiet, type: flag, default: true, flag: "-q", label: "Quiet"}
          - {name: pattern, type: string, default: "GET", required: true, label: "Pattern"}
          - {name: filter, type: string, default: "tcp port 80", required: false, label: "BPF filter"}
        needs_root: true
  # ----------------------------------------------------------------- wireless
  - id: aircrack-ng
    name: Aircrack-ng
    description: Wi-Fi monitoring suite that lists nearby networks and clients.
    category: wireless
    packages: [aircrack-ng]
    commands:
      - label: Enable monitor mode
        cmd: airmon-ng
        args:
          - {name: action, type: choice, default: "start", options: ["start", "stop", "check"], required: true, label: "Action"}
          - {name: interface, type: interface, label: "Interface", kind: wifi, default: "", required: true}
        needs_root: true
      - label: Scan networks (airodump)
        tty: true
        cmd: airodump-ng
        args:
          - {name: interface, type: interface, label: "Interface", kind: monitor, default: "", required: true}
        needs_root: true
  - id: kismet
    name: Kismet
    description: Wireless network and device detector, sniffer and IDS with a web UI.
    category: wireless
    source:
      type: upstream
      apt_repo: "deb https://www.kismetwireless.net/repos/apt/release/trixie trixie main"
      apt_key_url: https://www.kismetwireless.net/repos/kismet-release.gpg.key
      apt_key_sha256: 3496a7b046c133a8be8682f851aacb3e68dace45fd6324f3506e2591c79c2568
    packages: [kismet]
    commands:
      - label: Start Kismet (web UI on :2501)
        cmd: kismet
        args:
          - {name: interface, type: interface, label: "Interface", kind: wifi, default: "", required: true, flag: "-c"}
        needs_root: true
  # --------------------------------------------------------------- throughput
  - id: iperf3
    name: iperf3
    description: Measures TCP and UDP throughput between two hosts.
    category: throughput
    packages: [iperf3]
    commands:
      - label: Run server
        cmd: iperf3
        args:
          - {name: server, type: flag, default: true, flag: "-s", label: "Server mode"}
        needs_root: false
      - label: Run client
        cmd: iperf3
        args:
          - {name: client, type: string, default: "192.168.1.1", required: true, flag: "-c", label: "Server address"}
          - {name: time, type: int, default: 10, flag: "-t", label: "Duration (s)"}
          - {name: reverse, type: flag, default: false, flag: "-R", label: "Reverse (download)"}
        needs_root: false
  - id: iftop
    name: iftop
    description: Shows live bandwidth usage per connection on an interface.
    category: throughput
    packages: [iftop]
    commands:
      - label: Monitor interface
        tty: true
        cmd: iftop
        args:
          - {name: interface, type: interface, label: "Interface", default: "", required: true, flag: "-i"}
          - {name: no_resolve, type: flag, default: true, flag: "-n", label: "No DNS lookups"}
        needs_root: true
  - id: nload
    name: nload
    description: Live graph of incoming and outgoing traffic per interface.
    category: throughput
    packages: [nload]
    commands:
      - label: Monitor interface
        tty: true
        cmd: nload
        args:
          - {name: interface, type: interface, label: "Interface", default: "", required: true}
        needs_root: false
  - id: bmon
    name: bmon
    description: Bandwidth monitor with per-interface rate graphs.
    category: throughput
    packages: [bmon]
    commands:
      - label: Monitor
        tty: true
        cmd: bmon
        args:
          - {name: policy, type: string, default: "", required: false, flag: "-p", label: "Interface policy"}
        needs_root: false
  - id: speedtest
    name: Speedtest
    description: Measures internet download and upload speed against speedtest.net.
    category: throughput
    packages: [speedtest-cli]
    commands:
      - label: Run speed test
        cmd: speedtest-cli
        args:
          - {name: simple, type: flag, default: true, flag: "--simple", label: "Simple output"}
        needs_root: false
  # ----------------------------------------------------------------- dns-http
  - id: dnsutils
    name: dig / nslookup
    description: Queries DNS servers for any record type.
    category: dns-http
    packages: [bind9-dnsutils]
    commands:
      - label: dig
        cmd: dig
        args:
          - {name: server, type: string, default: "", required: false, flag: "@", sep: "", label: "Server"}
          - {name: name, type: string, default: "example.com", required: true, label: "Name"}
          - {name: type, type: choice, default: "A", options: ["A", "AAAA", "MX", "NS", "TXT", "CNAME", "SOA", "PTR", "ANY"], required: true, label: "Record type"}
        needs_root: false
      - label: nslookup
        cmd: nslookup
        args:
          - {name: name, type: string, default: "example.com", required: true, label: "Name"}
          - {name: server, type: string, default: "", required: false, label: "Server"}
        needs_root: false
  - id: curl
    name: curl
    description: Fetches a URL and shows HTTP headers and timing.
    category: dns-http
    packages: [curl]
    commands:
      - label: HEAD request
        cmd: curl
        args:
          - {name: head, type: flag, default: true, flag: "-I", label: "Headers only"}
          - {name: follow, type: flag, default: true, flag: "-L", label: "Follow redirects"}
          - {name: url, type: string, default: "https://example.com", required: true}
        needs_root: false
      - label: Timing breakdown
        cmd: curl
        args:
          - {name: silent, type: flag, default: true, flag: "-s", label: "Silent"}
          - {name: output, type: string, default: "/dev/null", required: true, flag: "-o", label: "Save body to"}
          - {name: format, type: string, default: "dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s http=%{http_code}\n", required: true, flag: "-w", label: "Timing format"}
          - {name: url, type: string, default: "https://example.com", required: true}
        needs_root: false
  # ==================================================================== DATA
  # ------------------------------------------------------------------- disks
  - id: lsblk
    name: Disks
    description: Lists every disk and partition with size, filesystem, label and mount point.
    category: disks
    packages: [util-linux]
    commands:
      - label: List disks
        cmd: lsblk
        args:
          - {name: fs, type: flag, default: true, flag: "-f", label: "Filesystems"}
          - {name: paths, type: flag, default: true, flag: "-p", label: "Full device paths"}
        needs_root: false
      - label: Partition tables
        cmd: fdisk
        args:
          - {name: list, type: flag, default: true, flag: "-l", label: "List layout"}
          - {name: device, type: string, default: "", required: false}
        needs_root: true
  - id: smartctl
    name: SMART health
    description: Reads a drive's own health report, error log and wear counters.
    category: disks
    packages: [smartmontools]
    commands:
      - label: Health summary
        cmd: smartctl
        args:
          - {name: health, type: flag, default: true, flag: "-H", label: "Health status"}
          - {name: info, type: flag, default: true, flag: "-i", label: "Drive info"}
          - {name: device, type: string, default: "/dev/sda", required: true}
        needs_root: true
      - label: Full report
        cmd: smartctl
        args:
          - {name: all, type: flag, default: true, flag: "-x", label: "Everything"}
          - {name: device, type: string, default: "/dev/sda", required: true}
        needs_root: true
  - id: nvme
    name: NVMe info
    description: Lists NVMe drives and shows their health and temperature log.
    category: disks
    packages: [nvme-cli]
    commands:
      - label: List drives
        cmd: nvme
        args:
          - {name: action, type: choice, default: "list", options: ["list"], required: true, label: "Command"}
        needs_root: true
      - label: Health log
        cmd: nvme
        args:
          - {name: action, type: choice, default: "smart-log", options: ["smart-log"], required: true, label: "Command"}
          - {name: device, type: string, default: "/dev/nvme0", required: true}
        needs_root: true
  # ---------------------------------------------------------------- recovery
  - id: testdisk
    name: TestDisk
    description: Finds lost partitions and repairs broken partition tables and boot sectors.
    category: recovery
    packages: [testdisk]
    commands:
      - label: Open TestDisk
        tty: true
        cmd: testdisk
        args: []
        needs_root: true
  - id: photorec
    name: PhotoRec
    description: Recovers deleted photos, documents and other files from a disk or card.
    category: recovery
    packages: [testdisk]
    commands:
      - label: Open PhotoRec
        tty: true
        cmd: photorec
        args: []
        needs_root: true
  - id: ddrescue
    name: ddrescue
    description: Copies a failing disk to an image, skipping bad areas and retrying them later.
    category: recovery
    packages: [gddrescue]
    commands:
      - label: Rescue disk to image
        tty: true
        cmd: ddrescue
        args:
          - {name: direct, type: flag, default: false, flag: "-d", label: "Direct disk access"}
          - {name: retries, type: int, default: 2, flag: "-r", label: "Retry passes"}
          - {name: source, type: string, default: "/dev/sdb", required: true}
          - {name: image, type: string, default: "/media/rescue.img", required: true, label: "Image file"}
          - {name: mapfile, type: string, default: "/media/rescue.map", required: true, label: "Map file"}
        needs_root: true
  # ------------------------------------------------------------------- files
  - id: hash
    name: Checksums
    description: Computes SHA-256 checksums of files to verify a download or a copy.
    category: files
    packages: [coreutils]
    commands:
      - label: SHA-256
        cmd: sha256sum
        args:
          - {name: file, type: string, default: "", required: true}
        needs_root: false
      - label: Verify SHA256SUMS
        cmd: sha256sum
        args:
          - {name: check, type: flag, default: true, flag: "-c", label: "Check mode"}
          - {name: ignore_missing, type: flag, default: true, flag: "--ignore-missing", label: "Ignore missing files"}
          - {name: sums_file, type: string, default: "SHA256SUMS", required: true, label: "Sums file"}
        needs_root: false
  - id: exiftool
    name: ExifTool
    description: Shows the hidden metadata in photos, documents and media files.
    category: files
    packages: [libimage-exiftool-perl]
    commands:
      - label: Show metadata
        cmd: exiftool
        args:
          - {name: file, type: string, default: "", required: true}
        needs_root: false
  - id: binwalk
    name: binwalk
    description: Scans a firmware image or binary for embedded files and filesystems.
    category: files
    packages: [binwalk]
    commands:
      - label: Scan file
        cmd: binwalk
        args:
          - {name: file, type: string, default: "", required: true}
        needs_root: false
  - id: xxd
    name: Hex dump
    description: Shows the raw bytes of a file in hex and ASCII.
    category: files
    packages: [xxd]
    commands:
      - label: Dump file
        cmd: xxd
        args:
          - {name: length, type: int, default: 1024, flag: "-l", label: "Bytes"}
          - {name: file, type: string, default: "", required: true}
        needs_root: false
  - id: ncdu
    name: ncdu
    description: Interactive disk usage browser that finds what is filling a drive.
    category: files
    packages: [ncdu]
    commands:
      - label: Browse usage
        tty: true
        cmd: ncdu
        args:
          - {name: one_fs, type: flag, default: true, flag: "-x", label: "Stay on one filesystem"}
          - {name: path, type: string, default: "/", required: true}
        needs_root: false
  # ---------------------------------------------------------------- transfer
  - id: rsync
    name: rsync
    description: Copies or mirrors folders between disks or over SSH, resuming where it stopped.
    category: transfer
    packages: [rsync]
    commands:
      - label: Copy folder
        cmd: rsync
        args:
          - {name: archive, type: flag, default: true, flag: "-a", label: "Archive mode"}
          - {name: progress, type: flag, default: true, flag: "--info=progress2", label: "Show progress"}
          - {name: dry_run, type: flag, default: true, flag: "--dry-run", label: "Dry run"}
          - {name: source, type: string, default: "", required: true}
          - {name: destination, type: string, default: "", required: true}
        needs_root: false
  # =================================================================== EXTRA
  # ------------------------------------------------------------------- extra
  - id: ltris
    name: LTris
    description: Falling-blocks puzzle game, a free Tetris clone (GPL-2+). Play with the keyboard.
    category: extra
    packages: [ltris]
    gui: true
    commands:
      - label: Open LTris
        cmd: /usr/games/ltris   # Debian games live in /usr/games, not always on the session PATH
        args: []
        needs_root: false
  - id: epiphany
    name: GNOME Web
    description: Lightweight web browser (Epiphany, GPL-3+) for router pages, docs and downloads.
    category: extra
    packages: [epiphany-browser]
    gui: true
    commands:
      - label: Open GNOME Web
        cmd: epiphany-browser
        args: []
        needs_root: false
  - id: obs-studio
    name: OBS Studio
    description: Records or streams the screen, a webcam and audio (GPL-2+).
    category: extra
    # screen capture on sway goes through PipeWire and the wlroots desktop portal on the user's D-Bus
    packages: [obs-studio, obs-plugins, pipewire, wireplumber, xdg-desktop-portal, xdg-desktop-portal-wlr, dbus-user-session]
    gui: true
    commands:
      - label: Open OBS Studio
        cmd: obs
        args: []
        needs_root: false
  - id: edex-ui
    name: eDEX-UI
    description: Sci-fi full-screen terminal with live system, network and file panels.
    category: extra
    packages: []          # edex-ui_*.deb from scripts/build-edex-deb.sh, when built
    optional: true
    gui: true
    commands:
      - label: Open eDEX-UI
        cmd: edex-ui
        args:
          - {name: no_sandbox, type: flag, default: true, flag: "--no-sandbox", label: "No sandbox"}
        needs_root: false
